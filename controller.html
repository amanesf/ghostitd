<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ゴーストコントローラー</title>
<style>
  :root{--bg:#07080a;--panel:rgba(20,24,29,.92);--line:rgba(255,255,255,.10);--mut:#9aa3ad;--mint:#39ff9e;
    --green:#39ff9e;--txt:#e8edf2;--mono:"SFMono-Regular",Consolas,Menlo,monospace}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  /* サイズはJS側(resize())がinnerWidth/innerHeightで管理。PIPカメラのビューポート計算と
     ズレるとPIP映像が枠からはみ出て見えるため、ここでは!importantで固定しない。 */
  #c{position:fixed;inset:0;display:block;touch-action:none}
  /* 高感度ノイズ: 低解像度のランダムグレースケールをCSSで画面いっぱいに拡大表示するオーバーレイ。
     #c(3D描画、PIP映像も同じcanvasにビューポート分割で描かれる)の真上、HUD/PIP枠より下のz-indexに
     置くことで、メイン画面・PIP映像の両方に同時にノイズがかかる(PIP専用に別処理を書く必要がない)。 */
  #noiseOverlay{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;
    image-rendering:pixelated;mix-blend-mode:overlay;opacity:0}
  /* 上部HUD(タイトル/戻るボタン)はPIPカメラ映像より上に配置 */
  .title{position:fixed;top:10px;left:14px;z-index:5;font-size:15px;font-weight:700;pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.7)}
  .title .eng{display:block;font-family:var(--mono);font-size:9px;font-weight:400;color:var(--green);
    letter-spacing:.22em;margin-top:3px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  #err{position:fixed;top:50px;left:14px;color:#ff8c8c;font-size:12px;z-index:9;pointer-events:none;max-width:260px}
  #topNav{position:fixed;top:8px;right:10px;z-index:7;display:flex;gap:6px}
  #topNav button{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
    background:rgba(20,24,29,.85);color:var(--txt);font-size:12.5px;cursor:pointer}
  #topNav button:active{background:rgba(57,255,158,.15)}

  /* 自撮りカメラ/一人称カメラのPIP(found footage風、16:9、REC+経過秒数付き)。上部HUDの下に配置。 */
  .pipBox{position:fixed;top:52px;left:10px;width:180px;height:101px;z-index:4;pointer-events:none;
    border:1px solid rgba(255,255,255,.28);border-radius:4px;overflow:hidden;display:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 10px rgba(0,0,0,.5)}
  .pipBox.visible{display:block}
  .pipBox.pipRight{left:auto;right:10px}
  .pipBox .pipLabel{position:absolute;bottom:3px;left:6px;font-family:var(--mono);font-size:8px;
    color:rgba(255,255,255,.75);letter-spacing:.08em;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  .pipBox .pipRec{position:absolute;top:4px;left:6px;display:flex;align-items:center;gap:4px;
    font-family:var(--mono);font-size:9px;color:#ff5a6e;letter-spacing:.04em;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  .pipBox .pipRec .dot{width:5px;height:5px;border-radius:50%;background:#ff2d3d;animation:pipBlink 1.4s infinite}
  .pipBox .pipTs{position:absolute;top:4px;right:6px;font-family:var(--mono);font-size:9px;
    color:rgba(255,255,255,.8);text-shadow:0 1px 3px rgba(0,0,0,.9);font-variant-numeric:tabular-nums}
  @keyframes pipBlink{0%,100%{opacity:1}50%{opacity:.15}}

  /* center drop card (mode choice / file picker), same pattern as character_3d.html */
  .drop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,86vw);padding:28px;
    text-align:center;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:16px}
  .drop.hide{display:none}
  .drop h2{margin:.1em 0 .3em;font-size:16px}
  .drop p{color:var(--mut);font-size:13px;margin:.3em 0 1.1em}
  .btn{height:42px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--txt);font-size:13px;cursor:pointer;padding:0 20px}
  .btn:active{transform:scale(.97)}

  .modeCard{display:block;cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.04);padding:14px 16px;margin-bottom:10px}
  .modeCard:active{background:rgba(57,255,158,.10);border-color:rgba(57,255,158,.4)}
  .modeCard.mint{border-color:rgba(57,255,158,.4)}
  .modeCard b{display:block;font-size:14px;color:var(--mint);margin-bottom:4px}
  .modeCard span{display:block;font-size:11.5px;color:var(--mut);line-height:1.5}

  /* 描画設定パネル */
  #configPanel{max-height:80vh;overflow-y:auto;text-align:left}
  #configPanel h2{text-align:center}
  .cfgRow{margin-bottom:16px;font-size:12.5px;color:var(--txt)}
  .cfgRow>label{display:flex;flex-direction:column;gap:6px}
  .cfgRow.cfgCheck>label{flex-direction:row;align-items:center;gap:8px;font-size:13px}
  .cfgRow input[type=range]{width:100%}
  .cfgRow select{height:34px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--txt);font-size:12.5px}
  #creditsSection{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .creditsTitle{font-size:11px;color:var(--mut);margin:0 0 6px;letter-spacing:.04em}
  #creditsList{margin:0;padding-left:18px;font-size:11px;color:var(--mut);line-height:1.7}
  #creditsList a{color:var(--mint)}

  /* virtual joystick (touch movement) */
  #joyBase{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom));width:112px;height:112px;
    border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--line);z-index:6;
    touch-action:none;display:none}
  #joyBase.visible{display:block}
  #joyKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);pointer-events:none}

  /* flashlight toggle */
  #flashToggle{display:none;position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:7;
    width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:rgba(20,24,29,.85);
    font-size:22px;cursor:pointer;color:var(--txt)}
  #flashToggle.visible{display:block}
  #flashToggle.on{border-color:var(--mint);box-shadow:0 0 14px rgba(57,255,158,.4)}
</style></head>
<body>
<canvas id="c"></canvas>
<canvas id="noiseOverlay"></canvas>
<div class="title">ゴーストコントローラー<span class="eng">GHOST CONTROLLER</span></div>
<div id="topNav">
  <button id="backToIndex" title="トップページに戻る">← トップ</button>
  <button id="configBtn" title="描画設定">⚙ config</button>
</div>
<div id="err"></div>

<div class="pipBox" id="selfieBox">
  <div class="pipRec"><span class="dot"></span>REC</div>
  <div class="pipTs" id="selfieTs">00:00</div>
  <div class="pipLabel">SELF-CAM</div>
</div>
<div class="pipBox pipRight" id="fpsBox">
  <div class="pipRec"><span class="dot"></span>REC</div>
  <div class="pipTs" id="fpsTs">00:00</div>
  <div class="pipLabel">POV-CAM</div>
</div>

<div class="drop hide" id="modeChoice">
  <h2>モードを選んでください</h2>
  <div class="modeCard mint" id="modeSampleBtn">
    <b>サンプルモデルで開く</b>
    <span>同梱のサンプルmodel.glbを自動読込して、その場で歩き回れます。</span>
  </div>
  <div class="modeCard" id="modeNormalBtn">
    <b>モデルを読み込む</b>
    <span>自分の.glbファイルを選択/ドラッグ&ドロップして操作します。</span>
  </div>
</div>

<div class="drop hide" id="drop">
  <h2>3Dモデルを読み込む</h2>
  <p>.glb ファイルを選択、またはドラッグ＆ドロップしてください。</p>
  <button class="btn" id="pick">ファイルを選択</button>
  <input type="file" id="file" accept=".glb,.gltf" style="display:none"/>
</div>

<div class="drop hide" id="configPanel">
  <h2>描画設定</h2>
  <div class="cfgRow"><label>霧の濃さ
    <input type="range" id="cfgFog" min="0" max="100" value="80">
  </label></div>
  <div class="cfgRow"><label>明るさ
    <input type="range" id="cfgBrightness" min="0" max="100" value="10">
  </label></div>
  <div class="cfgRow"><label>キャラの明るさ
    <input type="range" id="cfgCharBrightness" min="20" max="150" value="50">
  </label></div>
  <div class="cfgRow"><label>ノイズ(高感度)
    <input type="range" id="cfgNoise" min="0" max="100" value="18">
  </label></div>
  <div class="cfgRow"><label>FPS上限
    <select id="cfgFpsLimit">
      <option value="0">無制限(画面のリフレッシュレートに追従)</option>
      <option value="60">60fps</option>
      <option value="30" selected>30fps</option>
      <option value="24">24fps</option>
      <option value="15">15fps</option>
    </select>
  </label></div>
  <div class="cfgRow"><label>PIPカメラ画質
    <select id="cfgPipQuality">
      <option value="1" data-label="高(毎フレーム更新)">高(毎フレーム更新)</option>
      <option value="2" selected data-label="標準">標準</option>
      <option value="4" data-label="低(軽量)">低(軽量)</option>
    </select>
  </label></div>
  <div class="cfgRow cfgCheck"><label>
    <input type="checkbox" id="cfgPipEnable" checked> 自撮り/POVカメラを表示
  </label></div>
  <button class="btn" id="configClose">閉じる</button>
  <div id="creditsSection" style="display:none">
    <p class="creditsTitle">使用フリーモデル</p>
    <ul id="creditsList"></ul>
  </div>
</div>

<div id="joyBase"><div id="joyKnob"></div></div>
<button id="flashToggle" class="on" title="懐中電灯 ON/OFF">🔦</button>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/GLTFLoader.js"></script>
<script src="js/idb.js"></script>
<script>
(function(){
"use strict";
const cvs=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.NoToneMapping;
const maxAniso=renderer.capabilities.getMaxAnisotropy();

// --- 高感度ノイズ(画面全体+PIP、config「ノイズ」で強度調整可能) ---
// 画面解像度の約半分のランダムグレースケールを毎フレーム生成し、CSSでフル画面まで
// 引き伸ばす(image-rendering:pixelated)ことで、実際の高感度ISOノイズに近い粒状の
// ちらつきを安価に表現する(フル解像度で毎フレームMath.randomを回すよりも軽い)。
// #c(PIP映像も同じcanvasに描かれる)の真上に重ねているため、PIPにも自動的にノイズがかかる。
const noiseCanvas=document.getElementById('noiseOverlay');
const noiseCtx=noiseCanvas.getContext('2d');
const NOISE_SCALE=0.5;
let noiseImgData=null;
function resizeNoise(){
  const w=Math.max(1,Math.round(innerWidth*NOISE_SCALE));
  const h=Math.max(1,Math.round(innerHeight*NOISE_SCALE));
  noiseCanvas.width=w; noiseCanvas.height=h;
  noiseImgData=noiseCtx.createImageData(w,h);
}
function updateNoise(){
  const d=noiseImgData.data;
  for(let i=0;i<d.length;i+=4){
    const v=(Math.random()*255)|0;
    d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
  }
  noiseCtx.putImageData(noiseImgData,0,0);
}
function applyNoise(pct){
  noiseCanvas.style.opacity=(pct/100*0.5).toFixed(3);
}

// 夜霧の神社マップを見据えた暗く寒色寄りの背景+霧(Phase 1では地面は仮の平面のみ)。
// フォグ色を背景と同じほぼ黒(0x0a0c10)にしていると、フォグで暗く沈んでいくのか
// 単に光が届かず暗いのかが画面上で区別できず「霧が見えない」ことになるため、
// 視認できる程度に明るいグレー系の霧色にする(背景色もこれに合わせる)。
const FOG_COLOR=0x454e58;
const scene=new THREE.Scene();
scene.background=new THREE.Color(FOG_COLOR);
scene.fog=new THREE.FogExp2(FOG_COLOR,0.07);

const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,80);

// --- 自撮り/一人称のPIPカメラ(16:9固定、found footage風の演出) ---
const PIP_W=180, PIP_H=Math.round(PIP_W*9/16), PIP_MARGIN=10, PIP_TOP=52;
const selfieCam=new THREE.PerspectiveCamera(34,PIP_W/PIP_H,0.05,20);
const fpsCam=new THREE.PerspectiveCamera(62,PIP_W/PIP_H,0.05,60);
const selfieVP={x:0,y:0,w:PIP_W,h:PIP_H}, fpsVP={x:0,y:0,w:PIP_W,h:PIP_H};
// PIPは毎フレーム重いシーン全体を描画すると負荷が大きいので、実際の描画はPIP_FRAME_SKIP
// フレームに1回だけ行い、その結果をレンダーターゲット(テクスチャ)に焼き付けておく。
// 表示自体は毎フレーム、そのテクスチャを画面に貼るだけ(激安)にすることで、
// 「メインカメラがPIP領域を上書きしてしまい間だけちらつく」問題を避けつつ負荷も抑える。
let PIP_FRAME_SKIP=2; // configパネルの「PIPカメラ画質」の既定値(FPS上限30fps時に約15fps相当)。変更可能
let pipEnabled=true;
let frameCount=0;
// レンダーターゲットのtexture.encodingは既定でLinearEncodingになり、renderer.outputEncoding
// (sRGBEncoding)を素通りしてしまう(three.jsはレンダーターゲット描画時にrenderer.outputEncoding
// ではなくrenderTarget.texture.encodingを使う)。メイン画面と色味を合わせるため明示的に揃える。
const selfieRT=new THREE.WebGLRenderTarget(PIP_W,PIP_H,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,encoding:THREE.sRGBEncoding});
const fpsRT=new THREE.WebGLRenderTarget(PIP_W,PIP_H,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,encoding:THREE.sRGBEncoding});
const blitCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
function makeBlitScene(rt){
  const s=new THREE.Scene();
  const mat=new THREE.MeshBasicMaterial({map:rt.texture,depthTest:false,depthWrite:false,toneMapped:false});
  s.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
  return s;
}
const selfieBlitScene=makeBlitScene(selfieRT);
const fpsBlitScene=makeBlitScene(fpsRT);
function layoutPIPs(){
  const vy=innerHeight-PIP_TOP-PIP_H; // WebGLビューポートのyは下端起点のため変換
  selfieVP.x=PIP_MARGIN; selfieVP.y=vy;
  fpsVP.x=innerWidth-PIP_MARGIN-PIP_W; fpsVP.y=vy;
}

// 平行光はkeyLight1本に統合(hemiとあわせて2灯)。神社の灯籠やセンサーライト等と合わせると
// ライト数が多く重くなるため、fill/rimは削り、その分だけ少し強めにして明るさを補う。
const BASE_HEMI_INTENSITY=0.3, BASE_KEY_INTENSITY=0.42;
const hemiLight=new THREE.HemisphereLight(0x8fa5c8,0x0d0f13,BASE_HEMI_INTENSITY);
scene.add(hemiLight);
const keyLight=new THREE.DirectionalLight(0xaac2ff,BASE_KEY_INTENSITY); // 月明かり的な弱い寒色キーライト
keyLight.position.set(2,4,1.5);
scene.add(keyLight);


// --- 地面(Phase 1: 平坦な仮地面。神社の造形/砂利テクスチャはPhase 2) ---
// 単色ベタ塗りだと霧が同色の背景へ溶けるだけで濃淡が全く見えず「急に埋もれる」
// ように見えるため、フォグの滲みが視認できる程度の簡易な砂利風テクスチャを敷く。
function makeGroundTexture(){
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#262b31'; ctx.fillRect(0,0,256,256);
  for(let i=0;i<2200;i++){
    const x=Math.random()*256, y=Math.random()*256, r=0.6+Math.random()*1.4;
    const v=Math.random()<0.5? 18+Math.random()*14 : -1*(14+Math.random()*12);
    ctx.fillStyle='rgba('+(v>0?255:0)+','+(v>0?255:0)+','+(v>0?255:0)+','+(Math.abs(v)/255)+')';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(28,28);
  tex.anisotropy=maxAniso;
  return tex;
}
const groundGeo=new THREE.PlaneGeometry(100,120);
groundGeo.rotateX(-Math.PI/2);
groundGeo.translate(0,0,20); // 神社の参道がz=0からz=44付近まで伸びるため、地面も奥へ多めに確保
const groundMat=new THREE.MeshStandardMaterial({map:makeGroundTexture(),roughness:0.92,metalness:0});
const ground=new THREE.Mesh(groundGeo,groundMat);
scene.add(ground);

// --- 移動可能範囲の境界(地面のみ、建物等のコライダーは対象外)に沿って光る線を引く ---
// corridorBoundsAt(z)がzに応じて返すleft/rightの区分関数を細かくサンプリングし、
// 値が変化する箇所ごとに区間を区切ることで、将来corridorBoundsAtの形が変わっても
// 追従できるようにする(ハードコードした座標をここに直接書かない)。
function addBoundaryLine(x1,z1,x2,z2){
  const len=Math.hypot(x2-x1,z2-z1);
  if(len<1e-6)return;
  const w=0.012; // userフィードバックで太すぎたため1/10に(元は0.12)
  const geo=new THREE.PlaneGeometry(len,w);
  geo.rotateX(-Math.PI/2);
  const mat=new THREE.MeshBasicMaterial({color:0x39ff9e,transparent:true,opacity:0.85,
    toneMapped:false,depthWrite:false,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set((x1+x2)/2,0.03,(z1+z2)/2);
  mesh.rotation.y=Math.atan2(-(z2-z1),(x2-x1));
  scene.add(mesh);
}
function buildBoundaryLines(){
  const STEP=0.05; // 起動時に1回だけ実行するため細かくしても負荷は問題にならない
  let prev=corridorBoundsAt(PATH_MIN_Z);
  let leftStart=PATH_MIN_Z, rightStart=PATH_MIN_Z;
  for(let z=PATH_MIN_Z+STEP;z<=PATH_MAX_Z+1e-6;z+=STEP){
    const zc=Math.min(z,PATH_MAX_Z);
    const b=corridorBoundsAt(zc);
    if(b.left!==prev.left){
      addBoundaryLine(prev.left,leftStart,prev.left,zc);
      addBoundaryLine(prev.left,zc,b.left,zc);
      leftStart=zc;
    }
    if(b.right!==prev.right){
      addBoundaryLine(prev.right,rightStart,prev.right,zc);
      addBoundaryLine(prev.right,zc,b.right,zc);
      rightStart=zc;
    }
    prev=b;
  }
  addBoundaryLine(prev.left,leftStart,prev.left,PATH_MAX_Z);
  addBoundaryLine(prev.right,rightStart,prev.right,PATH_MAX_Z);
  // 手前(参道入口)と奥(禁足地側)の端を繋ぐキャップ
  const bStart=corridorBoundsAt(PATH_MIN_Z), bEnd=corridorBoundsAt(PATH_MAX_Z);
  addBoundaryLine(bStart.left,PATH_MIN_Z,bStart.right,PATH_MIN_Z);
  addBoundaryLine(bEnd.left,PATH_MAX_Z,bEnd.right,PATH_MAX_Z);
}

// --- 空気感演出: ふわふわ浮遊するホコリ状のパーティクル ---
// キャラクター中心の一定範囲内にパーティクルを配置し、範囲外に出たら反対側へラップさせることで
// 常にキャラクターの周囲だけを漂っているように見せる(全マップに敷き詰める必要がないため軽量)。
const DUST_COUNT=220;
const DUST_RANGE_XZ=22, DUST_RANGE_Y=6;
const dustGeo=new THREE.BufferGeometry();
const dustPosArr=new Float32Array(DUST_COUNT*3);
const dustSpeed=new Float32Array(DUST_COUNT);
const dustDrift=new Float32Array(DUST_COUNT*2);
for(let i=0;i<DUST_COUNT;i++){
  dustPosArr[i*3+0]=(Math.random()-0.5)*DUST_RANGE_XZ;
  dustPosArr[i*3+1]=Math.random()*DUST_RANGE_Y;
  dustPosArr[i*3+2]=(Math.random()-0.5)*DUST_RANGE_XZ;
  dustSpeed[i]=0.15+Math.random()*0.25;
  dustDrift[i*2+0]=(Math.random()-0.5)*0.15;
  dustDrift[i*2+1]=(Math.random()-0.5)*0.15;
}
dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPosArr,3));
const dustCanvas=document.createElement('canvas');
dustCanvas.width=dustCanvas.height=32;
const dustCtx=dustCanvas.getContext('2d');
const dustGrad=dustCtx.createRadialGradient(16,16,0,16,16,16);
dustGrad.addColorStop(0,'rgba(255,255,255,0.9)');
dustGrad.addColorStop(1,'rgba(255,255,255,0)');
dustCtx.fillStyle=dustGrad;
dustCtx.fillRect(0,0,32,32);
const dustTex=new THREE.CanvasTexture(dustCanvas);
const dustMat=new THREE.PointsMaterial({size:0.045,map:dustTex,transparent:true,opacity:0.35,
  depthWrite:false,fog:true,color:0xfff2d0,blending:THREE.AdditiveBlending});
const dustPoints=new THREE.Points(dustGeo,dustMat);
dustPoints.frustumCulled=false;
scene.add(dustPoints);
function updateDust(dt){
  const arr=dustGeo.attributes.position.array;
  const half=DUST_RANGE_XZ/2;
  for(let i=0;i<DUST_COUNT;i++){
    const ix=i*3;
    arr[ix+1]+=dustSpeed[i]*dt;
    arr[ix+0]+=dustDrift[i*2+0]*dt;
    arr[ix+2]+=dustDrift[i*2+1]*dt;
    if(arr[ix+1]>DUST_RANGE_Y)arr[ix+1]-=DUST_RANGE_Y;
    let dx=arr[ix+0]-charPos.x;
    if(dx>half)arr[ix+0]-=DUST_RANGE_XZ;else if(dx<-half)arr[ix+0]+=DUST_RANGE_XZ;
    let dz=arr[ix+2]-charPos.z;
    if(dz>half)arr[ix+2]-=DUST_RANGE_XZ;else if(dz<-half)arr[ix+2]+=DUST_RANGE_XZ;
  }
  dustGeo.attributes.position.needsUpdate=true;
}

// --- 軽量なフリーモデル(CC0/CC-BY、poly.pizza)を読み込めた場合はそちらを使い、
// 失敗時はこれまでのプロシージャル形状にフォールバックする。実際に使えたものだけ
// FREE_MODEL_CREDITSに記録し、configパネル下部のクレジット欄に表示する。
const FREE_MODEL_CREDITS=[];
function refreshCreditsUI(){
  const list=document.getElementById('creditsList'), section=document.getElementById('creditsSection');
  if(!FREE_MODEL_CREDITS.length){ section.style.display='none'; return; }
  section.style.display='block';
  list.innerHTML=FREE_MODEL_CREDITS.map(c=>
    '<li>'+c.name+' — '+c.author+'('+c.license+') <a href="'+c.url+'" target="_blank" rel="noopener">link</a></li>'
  ).join('');
}
function loadStaticGLB(url){
  return fetch(url).then(r=>{ if(!r.ok)throw 0; return r.arrayBuffer(); })
    .then(buf=>new Promise((resolve,reject)=>{
      new THREE.GLTFLoader().parse(buf,'',gltf=>resolve(gltf.scene),reject);
    }));
}
function normalizeToHeight(obj,targetHeight){
  obj.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(obj);
  const h=box.max.y-box.min.y;
  if(h>0.0001) obj.scale.multiplyScalar(targetHeight/h);
  obj.updateMatrixWorld(true);
  const box2=new THREE.Box3().setFromObject(obj);
  obj.position.y-=box2.min.y;
  return obj;
}

  shrineGroup.add(fallback);
  loadStaticGLB('models/torii_free.glb').then(obj=>{

function buildLantern(x,z,mode){ // mode: 'lit'|'cold'|'dark'
  const g=new THREE.Group();
  const stoneMat=new THREE.MeshStandardMaterial({color:0x565b5f,roughness:0.95});
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.3,0.18,10),stoneMat);
  base.position.y=0.09; g.add(base);
  const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.14,0.55,8),stoneMat);
  pedestal.position.y=0.18+0.275; g.add(pedestal);
  const fireBoxY=0.18+0.55+0.17;
  const fireBox=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.34,0.34),stoneMat);
  fireBox.position.y=fireBoxY; g.add(fireBox);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(0.32,0.28,4),stoneMat);
  roof.rotation.y=Math.PI/4; roof.position.y=fireBoxY+0.17+0.14; g.add(roof);
  if(mode!=='dark'){
    const lightColor=mode==='cold'?0x8fd8ff:0xffb066;
    // 灯籠ごとに本物の点光源を持たせるとライト数が増えすぎるため、実際に周囲を照らす
    // 点光源は「異様な寒色」の1つだけに絞り、通常の灯りは光る球体だけの見た目にする。
    if(mode==='cold'){
      const glow=new THREE.PointLight(lightColor,0.5,4.2,2);
      glow.position.y=fireBoxY; g.add(glow);
    }
    const glowMesh=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8),
      new THREE.MeshBasicMaterial({color:lightColor,toneMapped:false}));
    glowMesh.position.y=fireBoxY; g.add(glowMesh);
  }
  g.position.set(x,0,z);
  shrineGroup.add(g);
  colliders.push({type:'circle',x,z,r:0.32});
}

let basinBulb=null, basinSwingT=0;
function buildBasin(x,z){
  const g=new THREE.Group();
  const woodMat=new THREE.MeshStandardMaterial({color:0x3a2c22,roughness:0.85});
  const stoneMat=new THREE.MeshStandardMaterial({color:0x565b5f,roughness:0.95});
  const postH=2.2, halfW=1.0, halfD=0.75;
  [[-halfW,-halfD],[halfW,-halfD],[-halfW,halfD],[halfW,halfD]].forEach(([px,pz])=>{
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,postH,8),woodMat);
    post.position.set(px,postH/2,pz); g.add(post);
  });
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.5,0.6,4),woodMat);
  roof.rotation.y=Math.PI/4; roof.position.y=postH+0.3; g.add(roof);
  const basin=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.45,0.4,12),stoneMat);
  basin.position.y=0.2; g.add(basin);
  g.position.set(x,0,z);
  shrineGroup.add(g);
  colliders.push({type:'circle',x,z,r:0.55});
  // センサーライトの電球は見た目のモデルに関わらず同じ位置に独立して置く(placeMainHallの引き戸と同じ扱い)
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),
    new THREE.MeshBasicMaterial({color:0xffe9b0,toneMapped:false}));
  bulb.position.set(x,postH-0.5,z);
  shrineGroup.add(bulb);
  const bulbLight=new THREE.PointLight(0xffdca0,0.7,5,2);
  bulb.add(bulbLight);
  basinBulb=bulb;
  loadStaticGLB('models/chouzuya_free.glb').then(obj=>{
    normalizeToHeight(obj,postH+0.6);
    obj.position.set(x,0,z);
    // honden(placeMainHall)と同じ屋根瓦素材(yane)を共有しており、そのままだと
    // このシーンの控えめな照明下でほぼ真っ黒に潰れるため、同じ明度の底上げをかける。
    const _hsl={h:0,s:0,l:0};
    obj.traverse(o=>{ if(o.isMesh&&o.material&&o.material.color){
      o.material.color.getHSL(_hsl);
      o.material.color.setHSL(_hsl.h,Math.min(1,_hsl.s*1.1),Math.max(_hsl.l,0.42));
    }});
    shrineGroup.remove(g);
    shrineGroup.add(obj);
    FREE_MODEL_CREDITS.push({name:'手水舎',author:'つっちー',license:'商用利用・改変可(再配布不可)',url:'https://shoshinshaworks.booth.pm/items/2660016'});
    refreshCreditsUI();
    invalidate();
  }).catch(()=>{ /* 読み込み失敗時はプロシージャルの手水舎のまま */ });
}

function buildMainHallProcedural(){

  platform.position.y=0.2; g.add(platform);

function placeMainHall(z){
  const halfW=3.4, halfD=2.6;
  colliders.push({type:'box',minX:-halfW-0.4,maxX:halfW+0.4,minZ:z-halfD-0.4,maxZ:z+halfD+0.4});

  const fallback=buildMainHallProcedural();
  fallback.position.set(0,0,z);
  shrineGroup.add(fallback);
  loadStaticGLB('models/honden_free.glb').then(obj=>{
    normalizeToHeight(obj,4.4);
    obj.position.set(0,0,z);
    // 元モデルの素材がかなり暗く、このシーンの控えめな照明だと明度を掛け算しただけでは
    // ほぼ真っ黒に潰れてディテールが見えないため、HSLの明度に下限を設けて底上げする
    // (色味・彩度はそのまま活かす)。
    const _hsl={h:0,s:0,l:0};
    obj.traverse(o=>{ if(o.isMesh&&o.material&&o.material.color){
      o.material.color.getHSL(_hsl);
      o.material.color.setHSL(_hsl.h,Math.min(1,_hsl.s*1.1),Math.max(_hsl.l,0.42));
    }});
    shrineGroup.remove(fallback);
    shrineGroup.add(obj);
    FREE_MODEL_CREDITS.push({name:'Shrine(本殿)',author:'つっちー',license:'商用利用・改変可(再配布不可)',url:'https://booth.pm/ja/items/2659982'});
    refreshCreditsUI();
    invalidate();
  }).catch(()=>{ /* 読み込み失敗時はプロシージャルの本殿のまま */ });

  // 隙間から覗く純黒の引き戸(光の影響を受けない黒=MeshBasicMaterial)。見た目のモデルに関わらず
  // 参道側の同じ位置に重ねて置く(フリーモデルは旧プロシージャル版より小柄なので、戸も
  // 建物に対して控えめなアクセントに見える程度のサイズに縮小する)。
  const door=new THREE.Mesh(new THREE.PlaneGeometry(0.5,1.1),
    new THREE.MeshBasicMaterial({color:0x000000,side:THREE.DoubleSide}));
  door.position.set(0,1.0,z-halfD-0.01);
  door.rotation.y=Math.PI;
  shrineGroup.add(door);

  // 人感センサーライト: 普段は消灯、参道側から近づくと点灯するハロゲン風の光。
  sensorLight=new THREE.SpotLight(0xfff0d0,0,11,THREE.MathUtils.degToRad(48),0.4,1.2);
  sensorLight.position.set(0,3.3,z-halfD-0.3);
  sensorLight.target.position.set(0,0,z-halfD-4.5);
  scene.add(sensorLight); scene.add(sensorLight.target);
  hallFrontZ=z-halfD-0.3;
}

function scatterProps(url,count,minDist,maxDist,zMin,zMax,targetHeight,opts){
  opts=opts||{};
  loadStaticGLB(url).then(template=>{
    normalizeToHeight(template,targetHeight);
    for(let i=0;i<count;i++){
      const side=Math.random()<0.5?-1:1;
      const x=side*(minDist+Math.random()*(maxDist-minDist));
      const z=zMin+Math.random()*(zMax-zMin);
      const t=template.clone(true);
      const s=(opts.scaleMin||0.8)+Math.random()*((opts.scaleMax||1.3)-(opts.scaleMin||0.8));
      t.position.set(x,0,z);
      t.rotation.y=Math.random()*Math.PI*2;
      t.scale.multiplyScalar(s);
      shrineGroup.add(t);
      if(opts.collider)colliders.push({type:'circle',x,z,r:(opts.colliderR||0.4)*s});
    }
    if(opts.credit){ FREE_MODEL_CREDITS.push(opts.credit); refreshCreditsUI(); }
    invalidate();
  }).catch(()=>{ /* 読み込み失敗時はそのプロップなし(元々存在しなかったので実害なし) */ });
}

function buildForbiddenBoundary(z,halfW){
  const g=new THREE.Group();
  const stakeMat=new THREE.MeshStandardMaterial({color:0x2e2015,roughness:0.9});
  const ropeMat=new THREE.MeshStandardMaterial({color:0xcfc29a,roughness:0.95});
  const shideMat=new THREE.MeshBasicMaterial({color:0xf2efe6,side:THREE.DoubleSide});
  const stakeCount=6, stakeH=1.1, xs=[];
  for(let i=0;i<stakeCount;i++){
    const x=-halfW+(halfW*2)*(i/(stakeCount-1));
    xs.push(x);
    const stake=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,stakeH,8),stakeMat);
    stake.position.set(x,stakeH/2,0); g.add(stake);
  }
  for(let i=0;i<xs.length-1;i++){
    const x0=xs[i],x1=xs[i+1],midX=(x0+x1)/2,len=Math.abs(x1-x0),sag=0.05,ropeY=stakeH*0.82-sag;
    const rope=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,len,6),ropeMat);
    rope.rotation.z=Math.PI/2; rope.position.set(midX,ropeY,0); g.add(rope);
    const shide=new THREE.Mesh(new THREE.PlaneGeometry(0.12,0.3),shideMat);
    shide.position.set(midX,ropeY-0.18,0); g.add(shide);
  }
  g.position.z=z;
  shrineGroup.add(g);
  colliders.push({type:'box',minX:-halfW,maxX:halfW,minZ:z-0.15,maxZ:z+0.3});
}

function updateShrineEffects(dt){
  if(entranceLight){
    entranceFlickerT+=dt;
    let v=0.85+Math.sin(entranceFlickerT*9)*0.08+Math.sin(entranceFlickerT*23)*0.05;
    if(Math.random()<0.015)v*=0.25;
    entranceLight.intensity=Math.max(0,v);
  }
  if(basinBulb){
    basinSwingT+=dt;
    basinBulb.position.x=Math.sin(basinSwingT*1.3)*0.035;
    basinBulb.position.z=Math.cos(basinSwingT*0.9)*0.025;
  }
  if(sensorLight){
    const d=Math.hypot(charPos.x,charPos.z-hallFrontZ);
    sensorLightOn=d<5.5;
    sensorLight.intensity+=((sensorLightOn?1.7:0)-sensorLight.intensity)*Math.min(1,10*dt);
  }
}

  if(pipTimerHandle)clearInterval(pipTimerHandle);

  const selfieTs=document.getElementById('selfieTs'), fpsTs=document.getElementById('fpsTs');
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    const s=Math.floor((Date.now()-t0)/1000);
    const txt=pad(Math.floor(s/60)%100)+':'+pad(s%60);
    selfieTs.textContent=txt; fpsTs.textContent=txt;
  }
  tick(); pipTimerHandle=setInterval(tick,1000);
}

function attachFlashlight(){
  removeFlashlight();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.026,0.14,10),
    new THREE.MeshStandardMaterial({color:0x22262c,roughness:0.6}));
  body.rotation.x=Math.PI/2;
  const tip=new THREE.Mesh(new THREE.CylinderGeometry(0.023,0.023,0.02,10),
    new THREE.MeshBasicMaterial({color:0xfff3cf,toneMapped:false}));
  tip.rotation.x=Math.PI/2; tip.position.z=0.08;
  flashProp=new THREE.Group();
  flashProp.add(body); flashProp.add(tip);
  flashProp.position.set(0.01,-0.02,0.04); // 握っているように見える程度のオフセット(目視調整前提)
  const parent=handBone||model;
  if(parent) parent.add(flashProp);

  flashLight=new THREE.SpotLight(0xffe9b0, flashOn?1.5:0, 13, THREE.MathUtils.degToRad(30), 0.45, 1.3);
  flashLight.target=new THREE.Object3D();
  scene.add(flashLight);
  scene.add(flashLight.target);
  document.getElementById('flashToggle').classList.add('visible');
}
function removeFlashlight(){
  if(flashProp&&flashProp.parent) flashProp.parent.remove(flashProp);
  if(flashLight){ scene.remove(flashLight); scene.remove(flashLight.target); }
  flashProp=null; flashLight=null;
  document.getElementById('flashToggle').classList.remove('visible');
}
const _flashWorldPos=new THREE.Vector3();
function updateFlashlight(){
  if(!flashProp||!flashLight) return;
  flashProp.getWorldPosition(_flashWorldPos);
  flashLight.position.copy(_flashWorldPos);
  // ビームの狙う方向は手ボーンの生の回転(走行中に激しく振れる)ではなく、
  // キャラクターの向き(charYaw)から求めた水平前方ベクトルを使い、揺れを抑える。
  const fx=Math.sin(charYaw), fz=Math.cos(charYaw);
  flashLight.target.position.set(_flashWorldPos.x+fx*3, _flashWorldPos.y-0.15, _flashWorldPos.z+fz*3);
  flashLight.target.updateMatrixWorld();
}
document.getElementById('flashToggle').onclick=()=>{

  document.getElementById('flashToggle').classList.toggle('on',flashOn);

const MOTION_NAMES=['idle','run'];
function loadMotions(){
  if(!model||!mixer)return;
  MOTION_NAMES.forEach(name=>{
    fetch('motion_'+name+'.glb').then(r=>{ if(!r.ok)throw 0; return r.arrayBuffer(); })
      .then(buf=>new Promise((resolve,reject)=>{
        new THREE.GLTFLoader().parse(buf,'',gltf=>resolve(gltf.animations||[]),reject);
      }))
      .then(clips=>{
        if(!clips.length||!mixer)return;
        const action=mixer.clipAction(clips[0]);
        action.play();
        if(name==='idle'){ idleAction=action; action.weight=1; }
        else{ runAction=action; action.weight=0; }
      }).catch(()=>{ /* モーションglbが無ければ静止表示のまま */ });
  });
}

function loadCharacter(buf,onLoaded){
  new THREE.GLTFLoader().parse(buf,'',function(gltf){
    let hasMesh=false; gltf.scene.traverse(o=>{ if(o.isMesh)hasMesh=true; });
    if(!hasMesh){ document.getElementById('err').textContent='モデルにメッシュが含まれていません'; return; }
    clearCharacter();
    model=gltf.scene; characterRoot.add(model);
    model.traverse(o=>{ if(o.isMesh&&o.material){
      const old=o.material;
      // キャラクターはシーンのライティングの影響を受けない(常に地の色のまま見える)不透明な
      // マテリアルにする。暗い神社の中でも自撮り/POVカメラで顔がちゃんと見え、光源計算も
      // 不要になる分軽くなる(懐中電灯のビームもキャラの見た目には影響しなくなる)。
      const smoothMat=new THREE.MeshBasicMaterial({map:old.map||null,
        transparent:!!old.transparent,alphaTest:old.alphaTest||0,side:THREE.DoubleSide,skinning:!!o.isSkinnedMesh,
        toneMapped:false});
      if(smoothMat.map){smoothMat.map.encoding=THREE.sRGBEncoding;smoothMat.map.anisotropy=maxAniso;}
      o.material=smoothMat;
      characterMaterials.push(smoothMat);
    }});
    applyCharBrightness(charBrightnessPct); // configの現在値を新しいマテリアルにも反映する
    handBone=model.getObjectByName('hand_R')||null;
    headBone=model.getObjectByName('head')||null;
    model.position.y=0;
    model.updateMatrixWorld(true);
    let bbox=new THREE.Box3().setFromObject(model);
    // モデル原点(hipsボーン基準)は足裏と一致しないため、バウンディングボックスの
    // 最下点が地面(y=0)にちょうど接するよう補正する(でないと足が地面に埋まる)。
    model.position.y=-bbox.min.y;
    model.updateMatrixWorld(true);
    bbox=new THREE.Box3().setFromObject(model);
    charHeight=Math.max(0.5,bbox.max.y-bbox.min.y);
    charCenterY=bbox.min.y+charHeight*0.5;
    attachFlashlight();
    mixer=new THREE.AnimationMixer(model);
    document.getElementById('modeChoice').classList.add('hide');
    document.getElementById('drop').classList.add('hide');
    document.getElementById('joyBase').classList.add('visible');
    document.getElementById('selfieBox').classList.toggle('visible',pipEnabled);
    document.getElementById('fpsBox').classList.toggle('visible',pipEnabled);
    document.getElementById('err').textContent='';
    charPos.set(0,0,0); charYaw=0;
    startPipRecTimer();
    invalidate();
    if(onLoaded)onLoaded();
  }, e=>{ document.getElementById('err').textContent='読み込み失敗: '+((e&&e.message)||e); });
}

// 神社は+Z方向に伸びるレイアウトのため、既定のオービット角はカメラが-Z側(参道の手前)に
// 位置し+Z(鳥居の方)を向くようπにする。こうしないと既定状態でWキーが参道と逆に進んでしまう。
let orbitYaw=Math.PI, orbitPitch=0.35;
let camDist=3.6; const CAM_DIST_MIN=1.6, CAM_DIST_MAX=8.0;
let charYaw=0;
const charPos=new THREE.Vector3(0,0,0);
const MOVE_SPEED=3.2, YAW_LERP=12, BLEND_LERP=8, CHAR_R=0.3;
const CORRIDOR_HALF_W=7.5, PATH_MIN_Z=-3, PATH_MAX_Z=43;
let currentBlend=0;

function lerpAngle(a,b,t){
  let diff=(b-a+Math.PI*3)%(Math.PI*2)-Math.PI;
  return a+diff*t;
}

// --- キーボード入力 ---

function keyboardVec(){
  let x=0,y=0;
  if(keys.KeyW||keys.ArrowUp)y+=1;
  if(keys.KeyS||keys.ArrowDown)y-=1;
  if(keys.KeyA||keys.ArrowLeft)x-=1;
  if(keys.KeyD||keys.ArrowRight)x+=1;
  const len=Math.hypot(x,y);
  return len>1?{x:x/len,y:y/len}:{x,y};
}

// --- 仮想ジョイスティック(タッチ) ---
const joyBase=document.getElementById('joyBase'), joyKnob=document.getElementById('joyKnob');
let joyActive=false, joyPtrId=null, joyVec={x:0,y:0};
const JOY_R=56;
function joySetFromEvent(e){
  const rc=joyBase.getBoundingClientRect();
  const cx=rc.left+rc.width/2, cy=rc.top+rc.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const d=Math.hypot(dx,dy);
  if(d>JOY_R){ dx=dx/d*JOY_R; dy=dy/d*JOY_R; }
  joyKnob.style.transform='translate('+dx+'px,'+dy+'px)';
  joyVec={x:dx/JOY_R, y:-dy/JOY_R}; // 画面上方向=前進(y+)
}
function joyReset(){
  joyActive=false; joyPtrId=null; joyVec={x:0,y:0};
  joyKnob.style.transform='translate(0,0)';
}
joyBase.addEventListener('pointerdown',e=>{
  joyActive=true; joyPtrId=e.pointerId;
  try{ joyBase.setPointerCapture(e.pointerId); }catch(_){}
  joySetFromEvent(e);
});
joyBase.addEventListener('pointermove',e=>{ if(joyActive&&e.pointerId===joyPtrId) joySetFromEvent(e); });
joyBase.addEventListener('pointerup',e=>{ if(e.pointerId===joyPtrId) joyReset(); });
joyBase.addEventListener('pointercancel',e=>{ if(e.pointerId===joyPtrId) joyReset(); });

// --- カメラオービット・ズーム(canvas上のドラッグ/ホイール/ピンチ) ---
const ptrs=new Map(); let dragging=false, lx=0, ly=0, pinchDist=0;
function dist2(){ const v=[...ptrs.values()]; const dx=v[0].x-v[1].x, dy=v[0].y-v[1].y; return Math.hypot(dx,dy); }
cvs.addEventListener('pointerdown',e=>{
  try{ cvs.setPointerCapture(e.pointerId); }catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ dragging=true; lx=e.clientX; ly=e.clientY; }
  else if(ptrs.size===2){ dragging=false; pinchDist=dist2(); }
});
cvs.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){
    const d=dist2();
    if(pinchDist>0){ camDist*=pinchDist/d; camDist=Math.max(CAM_DIST_MIN,Math.min(CAM_DIST_MAX,camDist)); invalidate(); }
    pinchDist=d;
  }else if(dragging){
    orbitYaw-=(e.clientX-lx)*0.008;
    orbitPitch+=(e.clientY-ly)*0.008;
    orbitPitch=Math.max(0.05,Math.min(1.1,orbitPitch));
    lx=e.clientX; ly=e.clientY; invalidate();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId); if(ptrs.size<2)pinchDist=0; if(ptrs.size===0)dragging=false;
  else if(ptrs.size===1){ const v=[...ptrs.values()][0]; dragging=true; lx=v.x; ly=v.y; }
}
cvs.addEventListener('pointerup',endPtr);
cvs.addEventListener('pointercancel',endPtr);
cvs.addEventListener('wheel',e=>{
  e.preventDefault();
  camDist*=(1+Math.sign(e.deltaY)*0.08);
  camDist=Math.max(CAM_DIST_MIN,Math.min(CAM_DIST_MAX,camDist));
  invalidate();
},{passive:false});

// 境内(z=12〜19)だけ東側(+X)の境界を張り出させ、木立の奥に隠れた小さな広場を作る。
function corridorBoundsAt(z){
  if(z>=12&&z<=19)return {left:-CORRIDOR_HALF_W,right:14};
  return {left:-CORRIDOR_HALF_W,right:CORRIDOR_HALF_W};
}
function resolveCollision(pos){
  const b=corridorBoundsAt(pos.z);
  pos.x=Math.max(b.left+CHAR_R,Math.min(b.right-CHAR_R,pos.x));
  pos.z=Math.max(PATH_MIN_Z+CHAR_R,Math.min(PATH_MAX_Z-CHAR_R,pos.z));
  colliders.forEach(c=>{
    if(c.type==='circle'){
      const dx=pos.x-c.x, dz=pos.z-c.z, d=Math.hypot(dx,dz), minD=c.r+CHAR_R;
      if(d<minD&&d>1e-5){ pos.x=c.x+dx/d*minD; pos.z=c.z+dz/d*minD; }
    }else if(c.type==='box'){
      const inMinX=c.minX-CHAR_R, inMaxX=c.maxX+CHAR_R, inMinZ=c.minZ-CHAR_R, inMaxZ=c.maxZ+CHAR_R;
      if(pos.x>inMinX&&pos.x<inMaxX&&pos.z>inMinZ&&pos.z<inMaxZ){
        const dLeft=pos.x-inMinX, dRight=inMaxX-pos.x, dNear=pos.z-inMinZ, dFar=inMaxZ-pos.z;
        const m=Math.min(dLeft,dRight,dNear,dFar);
        if(m===dLeft)pos.x=inMinX; else if(m===dRight)pos.x=inMaxX;
        else if(m===dNear)pos.z=inMinZ; else pos.z=inMaxZ;
      }
    }
  });
  return pos;
}

// 画面上部に自撮り/一人称のPIPを置いた分、メインカメラの注視点を実際の
// キャラ中心よりやや上に取り、キャラの見え方を画面下寄りにしてPIPと被らないようにする。
const FRAME_BIAS_FRAC=0.22;
const _camTarget=new THREE.Vector3(), _camOffset=new THREE.Vector3(), _camDesired=new THREE.Vector3();
const _camRaycaster=new THREE.Raycaster(), _camDir=new THREE.Vector3();
function updateCamera(dt){
  _camTarget.set(charPos.x, charPos.y+charCenterY+charHeight*FRAME_BIAS_FRAC, charPos.z);
  _camOffset.set(
    Math.sin(orbitYaw)*Math.cos(orbitPitch),
    Math.sin(orbitPitch),
    Math.cos(orbitYaw)*Math.cos(orbitPitch)
  ).multiplyScalar(camDist);
  _camDesired.copy(_camTarget).add(_camOffset);

  // 木や岩などの神社オブジェクトにカメラがめり込まないよう、注視点→希望位置へレイを飛ばし
  // 手前で遮られていたらそこで止める(見た目上の"カメラが茂みの中に埋まる"問題を防ぐ)。
  _camDir.copy(_camOffset); const desiredDist=_camDir.length(); _camDir.normalize();
  _camRaycaster.set(_camTarget,_camDir); _camRaycaster.near=0.1; _camRaycaster.far=desiredDist;
  const hits=_camRaycaster.intersectObject(shrineGroup,true);
  const dist=hits.length?Math.max(0.6,hits[0].distance-0.3):desiredDist;
  _camDesired.copy(_camTarget).addScaledVector(_camDir,dist);

  const t=1-Math.pow(0.0001,Math.min(dt,0.1));
  cam.position.lerp(_camDesired,t);
  cam.lookAt(_camTarget);
}

const _headWP=new THREE.Vector3();
function updatePipCameras(){
  if(!headBone)return;
  headBone.getWorldPosition(_headWP);
  // 手ボーンの生の回転をそのまま使わない懐中電灯と同じ理由で、向きはcharYaw基準の
  // 水平前方ベクトルを使い、走行アニメーション中の頭の細かな回転で揺れないようにする。
  const fx=Math.sin(charYaw), fz=Math.cos(charYaw);
  // 自撮りなので顔(頭ボーン中心)そのものを画面中央に、もっとアップで捉える。
  selfieCam.position.set(_headWP.x+fx*0.55, _headWP.y+0.04, _headWP.z+fz*0.55);
  selfieCam.lookAt(_headWP.x, _headWP.y+0.02, _headWP.z);
  fpsCam.position.set(_headWP.x+fx*0.08, _headWP.y+0.05, _headWP.z+fz*0.08);
  fpsCam.lookAt(_headWP.x+fx*5, _headWP.y+0.03, _headWP.z+fz*5);
}

const clock=new THREE.Clock();
// デバッグ/検証用に主要な状態を露出(Playwrightでの自動確認に使う)。
window.__ghostController={ get charPos(){return charPos;}, get charYaw(){return charYaw;},
  get orbitYaw(){return orbitYaw;}, get orbitPitch(){return orbitPitch;}, get camDist(){return camDist;},
  get currentBlend(){return currentBlend;}, get model(){return model;}, get scene(){return scene;},
  get ground(){return ground;}, get charHeight(){return charHeight;}, get charCenterY(){return charCenterY;},
  get sensorLightOn(){return sensorLightOn;},
  setCharPos(x,z){ charPos.set(x,0,z); resolveCollision(charPos); invalidate(); } };

function tick(){
  requestAnimationFrame(tick);
  const rawDt=Math.min(clock.getDelta(),0.05);
  if(TARGET_FPS>0){
    // FPS上限が設定されている場合は、経過時間を貯めて1/TARGET_FPS秒に満たない間は
    // 更新も描画もせずスキップする(requestAnimationFrame自体は毎回呼び続けて次回に備える)。
    _fpsAccum+=rawDt;
    const step=1/TARGET_FPS;
    if(_fpsAccum<step)return;
    frame(_fpsAccum);
    _fpsAccum=0;
  }else{
    frame(rawDt);
  }
}
function frame(dt){
  updateShrineEffects(dt);
  updateDust(dt);
  updateNoise();
  invalidate(); // 点滅灯・吊り電球の揺れ・ホコリの浮遊は常時アニメーションするため毎フレーム再描画

  if(model){
    const inputVec=joyActive?joyVec:keyboardVec();
    const inputMag=Math.min(1,Math.hypot(inputVec.x,inputVec.y));
    const camForward=new THREE.Vector3(-Math.sin(orbitYaw),0,-Math.cos(orbitYaw));
    const camRight=new THREE.Vector3(-camForward.z,0,camForward.x);
    const dir=camForward.multiplyScalar(inputVec.y).add(camRight.multiplyScalar(inputVec.x));
    const hasDir=dir.lengthSq()>1e-6;
    if(hasDir)dir.normalize();

    currentBlend+=(Math.min(1,inputMag)-currentBlend)*Math.min(1,BLEND_LERP*dt);
    if(idleAction&&runAction){ idleAction.weight=1-currentBlend; runAction.weight=currentBlend; }
    if(mixer)mixer.update(dt);

    if(hasDir){
      const targetYaw=Math.atan2(dir.x,dir.z);
      charYaw=lerpAngle(charYaw,targetYaw,Math.min(1,YAW_LERP*dt));
    }
    characterRoot.rotation.y=charYaw;

    if(hasDir&&currentBlend>0.001){
      const disp=dir.multiplyScalar(MOVE_SPEED*currentBlend*dt);
      charPos.add(disp);
      resolveCollision(charPos);
    }
    characterRoot.position.set(charPos.x,0,charPos.z);

    updateFlashlight();
    updatePipCameras();
    invalidate(); // idle待機モーション自体が常に動くため毎フレーム再描画
  }

  updateCamera(dt);
  frameCount++;
  if(model&&pipEnabled&&frameCount%PIP_FRAME_SKIP===0){
    // 重いPIPシーン描画はここで間引いて行い、結果をレンダーターゲットに焼き付けるだけ
    // (画面には直接出さない)。表示は下のneedsRenderブロックで毎フレーム安価に行う。
    renderer.setScissorTest(false);
    // PIPカメラはキャラクターのすぐ近くに寄るため、メイン画面と同じ密度のホコリだと
    // 画面手前で大きく・濃く重なって見えてしまう。PIP描画時だけ薄く/小さくする
    // (メイン画面の見た目には一切影響しない、このブロックの中だけの一時変更)。
    const _dustSizeOrig=dustMat.size, _dustOpOrig=dustMat.opacity;
    dustMat.size=_dustSizeOrig*0.55;
    dustMat.opacity=_dustOpOrig*0.4;
    renderer.setRenderTarget(selfieRT);
    renderer.render(scene,selfieCam);
    renderer.setRenderTarget(fpsRT);
    renderer.render(scene,fpsCam);
    renderer.setRenderTarget(null);
    dustMat.size=_dustSizeOrig;
    dustMat.opacity=_dustOpOrig;
  }
  if(needsRender){
    renderer.setScissorTest(false);
    renderer.setViewport(0,0,innerWidth,innerHeight);
    renderer.render(scene,cam);
    // PIPは毎フレーム、焼き付け済みのテクスチャを該当領域に貼るだけ(激安)にすることで、
    // メインカメラの描画がPIP領域を上書きしてちらつくのを防ぎつつ、負荷も抑えている。
    if(model&&pipEnabled){
      renderer.setScissorTest(true);
      renderer.setViewport(selfieVP.x,selfieVP.y,selfieVP.w,selfieVP.h);
      renderer.setScissor(selfieVP.x,selfieVP.y,selfieVP.w,selfieVP.h);
      renderer.clearDepth();
      renderer.render(selfieBlitScene,blitCam);
      renderer.setViewport(fpsVP.x,fpsVP.y,fpsVP.w,fpsVP.h);
      renderer.setScissor(fpsVP.x,fpsVP.y,fpsVP.w,fpsVP.h);
      renderer.clearDepth();
      renderer.render(fpsBlitScene,blitCam);
      renderer.setScissorTest(false);
    }
    needsRender=false;
  }
}
// configパネルの各スライダー/セレクトのvalue属性(HTML側の初期値)に描画状態を同期させる
// (needsRender/charPos等、後方で宣言されるletを参照するinvalidate()を呼ぶため、
// それらの宣言が済んだ最後にまとめて実行する)
applyFogDensity(+document.getElementById('cfgFog').value);
applyBrightness(+document.getElementById('cfgBrightness').value);
applyCharBrightness(+document.getElementById('cfgCharBrightness').value);
applyNoise(+document.getElementById('cfgNoise').value);
applyFpsLimit(document.getElementById('cfgFpsLimit').value);
buildBoundaryLines(); // corridorBoundsAt/PATH_MIN_Z/PATH_MAX_Zの宣言が済んだ後でないと呼べない
tick();
})();
</script>
</body></html>
